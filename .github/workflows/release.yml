name: Release

# A published GitHub release tagged v<version> goes to the marketplace; a
# pre-release goes to its beta channel. A manual run is a dry run by default,
# and always when started from a branch, where no tag pins the version: it
# builds, checks and signs, and uploads nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, check and sign, but do not upload
        type: boolean
        default: true

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    uses: prusa3d/prusa-connect-marketplace-publish/.github/workflows/publish.yml@56dae34cf597f36239b0fefea87d07de0c91d236 # v1.0.2
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # The extension's id comes from this, so a renamed repository keeps it.
      module: github.com/rajtslegr/printer-keys
      dry-run: ${{ inputs.dry_run || !startsWith(github.ref, 'refs/tags/') }}
    secrets:
      PRUSA_CONNECT_EXTENSION_SIGNING_KEY: ${{ secrets.PRUSA_CONNECT_EXTENSION_SIGNING_KEY }}

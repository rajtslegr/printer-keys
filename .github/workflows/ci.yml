name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      # The oldest core module.yaml allows must still take the release.
      - name: Install into Prusa Connect 0.1.0-beta.1
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0-beta.1 -R prusa3d/prusa-connect -p prusa_connect_amd64 -p SHA256SUMS
          grep ' prusa_connect_amd64$' SHA256SUMS | sha256sum -c -
          chmod +x prusa_connect_amd64
          sh scripts/install-check.sh ./prusa_connect_amd64
